<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطاری آنلاین | به زودی</title>
    <style>
        /* استایل‌های کلی */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Tahoma', sans-serif;
            color: #333;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2d5a27; /* سبز گیاهی */
        }

        p {
            font-size: 1.2rem;
            color: #666;
        }

        /* ساخت چرخ‌دنده یا انیمیشن چرخش */
        .loader {
            width: 80px;
            height: 80px;
            border: 8px solid #f3f3f3;
            border-top: 8px solid #2d5a27; /* رنگ سبز */
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }

        /* انیمیشن چرخش */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* استایل دکمه (اختیاری برای زیبایی) */
        .footer-text {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- چرخ‌دنده در حال چرخش -->
        <div class="loader"></div>

        <h1>عطاری آنلاین</h1>
        <p>با احترام، سایت ما در حال آماده‌سازی است.</p>
        <p>برای تجربه بهترین محصولات گیاهی و طبیعی، لطفا کمی دیگر بازگردید.</p>

        <div class="footer-text">
            © 2026 تمامی حقوق محفوظ است
        </div>
    </div>

</body>
</html>
